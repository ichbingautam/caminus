name: Latency & Throughput Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    name: Pipeline Latency & Throughput Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Native C++ Dependencies (RocksDB & Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev libclang-dev build-essential pkg-config libssl-dev

      - name: Execute High-Throughput E2E Pipeline Benchmark
        run: cargo test --test e2e_benchmark -- --nocapture
