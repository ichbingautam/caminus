name: Caminus CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Native C++ Dependencies (RocksDB & Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev libclang-dev build-essential pkg-config libssl-dev

      - name: Check Code Formatting
        run: cargo fmt --check

      - name: Execute Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Unit & Integration Test Suites
        run: cargo test --all-targets --all-features

  docker:
    name: Production Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: caminus:latest
